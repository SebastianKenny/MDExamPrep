<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117; --surface: #161b27; --card: #1c2333; --border: #2a3347;
    --accent: #3ecf8e; --accent2: #5b8dee; --danger: #e05252;
    --text: #e8edf5; --muted: #6b7a99; --radius: 12px;
  }
  body.light {
    --bg: #f0f4fb; --surface: #ffffff; --card: #ffffff; --border: #d0d9ed;
    --accent: #1a9e67; --accent2: #3060cc; --danger: #c43030; --text: #0f1a2e; --muted: #5a6a8a;
  }
  body.light .header { background: linear-gradient(135deg, #1a3a7a 0%, #2d1a5e 100%); }
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; transition: background 0.2s, color 0.2s; }
  .header { background: linear-gradient(135deg, #0d1f3c 0%, #1a0e2e 100%); border-bottom: 1px solid var(--border); padding: 40px; text-align: center; }
  .header h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--accent); }
  .header p { font-size: 0.85rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 8px; }
  .header a { color: var(--accent2); font-size: 0.8rem; font-family: 'DM Mono', monospace; text-decoration: none; }

  main { max-width: 800px; margin: 0 auto; padding: 48px 24px 80px; }

  #signed-out-msg, #empty-msg { text-align: center; color: var(--muted); padding: 60px 20px; }
  #signed-out-msg button {
    margin-top: 16px; background: var(--accent); color: #0e1117; border: none;
    border-radius: 50px; padding: 10px 22px; font-weight: 600; cursor: pointer;
  }

  .attempt-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 22px; margin-bottom: 12px;
  }
  .attempt-left h3 { font-size: 1rem; margin-bottom: 4px; }
  .attempt-left p { font-size: 0.78rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .attempt-score { text-align: right; }
  .attempt-score .pct { font-family: 'DM Serif Display', serif; font-size: 1.5rem; }
  .attempt-score .frac { font-size: 0.75rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .pct.good { color: var(--accent); }
  .pct.mid { color: #f6a623; }
  .pct.low { color: var(--danger); }
  .mode-tag {
    font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted);
    border: 1px solid var(--border); border-radius: 50px; padding: 2px 10px; margin-top: 4px; display: inline-block;
  }

  .review-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 50px; padding: 6px 14px; font-size: 0.72rem; font-family: 'DM Mono', monospace;
    cursor: pointer; margin-top: 8px; transition: all 0.15s;
  }
  .review-btn:hover { border-color: var(--accent2); color: var(--text); }

  .review-panel {
    display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .review-panel.show { display: block; }
  .review-q {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .review-q .rq-lecture { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-bottom: 6px; }
  .review-q .rq-question { font-size: 0.92rem; margin-bottom: 10px; line-height: 1.5; }
  .review-q .rq-opt { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; border: 1px solid transparent; }
  .review-q .rq-opt.rq-correct { background: rgba(62,207,142,0.12); border-color: var(--accent); color: var(--accent); }
  .review-q .rq-opt.rq-wrong { background: rgba(224,82,82,0.12); border-color: var(--danger); color: var(--danger); }
  .review-q .rq-exp { font-size: 0.82rem; color: var(--muted); margin-top: 10px; line-height: 1.5; border-top: 1px dashed var(--border); padding-top: 10px; }

  .theme-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 50px; padding: 8px 16px; cursor: pointer; font-size: 0.8rem; color: rgba(255,255,255,0.75); font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
  .theme-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>

  <div class="header">
    <div style="display:flex; justify-content:flex-end; max-width:800px; margin:0 auto 16px;">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️ Light Mode</button>
    </div>
    <h1>Your Exam History</h1>
    <p>EVERY ATTEMPT, SYNCED TO YOUR ACCOUNT</p>
    <p style="margin-top:14px"><a href="index.html">← Back to all exams</a></p>
  </div>

  <main>
    <div id="signed-out-msg" style="display:none;">
      <p>Sign in (top right) to see your exam history.</p>
    </div>
    <div id="empty-msg" style="display:none;">
      <p>No attempts saved yet — finish a quiz while signed in and it'll show up here.</p>
    </div>
    <div id="history-list"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    async function renderHistory() {
      const user = window.currentUser;
      const listEl = document.getElementById('history-list');
      const signedOutEl = document.getElementById('signed-out-msg');
      const emptyEl = document.getElementById('empty-msg');
      listEl.innerHTML = '';
      signedOutEl.style.display = 'none';
      emptyEl.style.display = 'none';

      if (!user) {
        signedOutEl.style.display = 'block';
        return;
      }

      const attempts = await window.getMyHistory();
      if (attempts.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }

      let idx = 0;
      for (const a of attempts) {
        idx++;
        const rowId = `attempt-${idx}`;
        const pct = a.pct ?? (a.total > 0 ? Math.round((a.correct / a.total) * 100) : 0);
        const pctClass = pct >= 80 ? 'good' : pct >= 60 ? 'mid' : 'low';
        const date = a.timestamp && a.timestamp.toDate ? a.timestamp.toDate() : null;
        const dateStr = date ? date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
        const wrongList = Array.isArray(a.wrong) ? a.wrong : [];

        const row = document.createElement('div');
        row.className = 'attempt-row';
        row.style.flexDirection = 'column';
        row.style.alignItems = 'stretch';

        const topRow = document.createElement('div');
        topRow.style.display = 'flex';
        topRow.style.alignItems = 'center';
        topRow.style.justifyContent = 'space-between';
        topRow.style.gap = '16px';
        topRow.innerHTML = `
          <div class="attempt-left">
            <h3>${a.examName || 'Untitled exam'}</h3>
            <p>${dateStr}</p>
            <span class="mode-tag">${a.mode === 'nontutored' ? '📝 Exam Mode' : '🎓 Tutored'}</span>
            ${wrongList.length > 0 ? `<button class="review-btn" id="btn-${rowId}">Review ${wrongList.length} missed question${wrongList.length === 1 ? '' : 's'}</button>` : ''}
          </div>
          <div class="attempt-score">
            <div class="pct ${pctClass}">${pct}%</div>
            <div class="frac">${a.correct} / ${a.total}</div>
          </div>
        `;
        row.appendChild(topRow);

        if (wrongList.length > 0) {
          const panel = document.createElement('div');
          panel.className = 'review-panel';
          panel.id = `panel-${rowId}`;
          panel.innerHTML = wrongList.map(w => {
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            const optsHtml = w.opts.map((opt, i) => {
              let cls = 'rq-opt';
              if (i === w.correctAnswer) cls += ' rq-correct';
              else if (i === w.yourAnswer) cls += ' rq-wrong';
              const tag = i === w.correctAnswer ? ' ✓ correct' : (i === w.yourAnswer ? ' ✗ your answer' : '');
              return `<div class="${cls}">${letters[i]}) ${opt}${tag}</div>`;
            }).join('');
            return `
              <div class="review-q">
                ${w.lecture ? `<div class="rq-lecture">${w.lecture}</div>` : ''}
                <div class="rq-question">${w.q}</div>
                ${optsHtml}
                ${w.exp ? `<div class="rq-exp">${w.exp}</div>` : ''}
              </div>
            `;
          }).join('');
          row.appendChild(panel);

          const btn = topRow.querySelector(`#btn-${rowId}`);
          btn.onclick = () => {
            const isShown = panel.classList.toggle('show');
            btn.textContent = isShown
              ? 'Hide missed questions'
              : `Review ${wrongList.length} missed question${wrongList.length === 1 ? '' : 's'}`;
          };
        }

        listEl.appendChild(row);
      }
    }

    window.addEventListener('auth-ready', renderHistory);
  </script>

<script>
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
}
</script>
</body>
</html>
