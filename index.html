<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Review — Question Banks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #3ecf8e;
    --accent2: #5b8dee;
    --accent3: #e07b3e;
    --text: #e8edf5;
    --muted: #6b7a99;
    --radius: 12px;
  }
  body.light {
    --bg: #f0f4fb; --surface: #ffffff; --card: #ffffff; --border: #d0d9ed;
    --accent: #1a9e67; --accent2: #3060cc; --accent3: #c05a1a; --text: #0f1a2e; --muted: #5a6a8a;
  }
  body.light .header { background: linear-gradient(135deg, #1a3a7a 0%, #2d1a5e 100%); }
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; transition: background 0.2s, color 0.2s; }

  .header {
    background: linear-gradient(135deg, #0d1f3c 0%, #1a0e2e 100%);
    border-bottom: 1px solid var(--border);
    padding: 40px;
    text-align: center;
  }
  .header h1 { font-family: 'DM Serif Display', serif; font-size: 2.2rem; color: var(--accent); letter-spacing: -0.5px; }
  .header p { font-size: 0.85rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 8px; }
  .header a { color: var(--accent2); font-size: 0.8rem; font-family: 'DM Mono', monospace; text-decoration: none; }

  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }

  .section-label { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin: 40px 0 16px; }
  .section-label:first-child { margin-top: 0; }

  .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }

  .exam-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; text-decoration: none; color: var(--text); display: block;
    transition: border-color 0.15s, transform 0.15s;
  }
  .exam-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .exam-card h3 { font-size: 1.05rem; margin-bottom: 8px; }
  .exam-card p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .exam-card .q-count {
    display: inline-block; font-family: 'DM Mono', monospace; font-size: 0.72rem;
    color: var(--accent); border: 1px solid var(--border); border-radius: 50px; padding: 4px 12px;
  }

  #empty-msg { text-align: center; color: var(--muted); padding: 60px 20px; display: none; }

  footer { text-align: center; padding: 30px; color: var(--muted); font-size: 0.78rem; font-family: 'DM Mono', monospace; }

  .theme-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 50px; padding: 8px 16px; cursor: pointer; font-size: 0.8rem; color: rgba(255,255,255,0.75); font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
  .theme-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>

  <div class="header">
    <div style="display:flex; justify-content:flex-end; max-width:960px; margin:0 auto 16px;">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️ Light Mode</button>
    </div>
    <h1>Exam Review</h1>
    <p>PICK A QUESTION BANK TO START PRACTICING</p>
    <p style="margin-top:14px"><a href="history.html">📊 View your exam history</a></p>
  </div>

  <main id="exam-list-root">
    <div id="empty-msg">No exams in the catalog yet — add one to <code>exams.js</code>.</div>
  </main>

  <footer>Please email Kenny at skenny@stanford.edu if you find any errors or have any feedback!</footer>

  <script src="exams.js"></script>
  <script>
    (function renderExamList() {
      const root = document.getElementById('exam-list-root');
      const emptyMsg = document.getElementById('empty-msg');
      const list = (typeof EXAMS !== 'undefined' && Array.isArray(EXAMS)) ? EXAMS : [];

      if (list.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }

      // Group exams by section, preserving first-seen order
      const sections = [];
      const bySection = {};
      list.forEach(exam => {
        const key = exam.section || 'Exams';
        if (!bySection[key]) { bySection[key] = { icon: exam.icon || '📝', items: [] }; sections.push(key); }
        bySection[key].items.push(exam);
      });

      sections.forEach(sectionName => {
        const { icon, items } = bySection[sectionName];

        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = `${icon} ${sectionName}`;
        root.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'exam-grid';
        items.forEach(exam => {
          const a = document.createElement('a');
          a.className = 'exam-card';
          a.href = exam.file;
          a.innerHTML = `
            <h3>${exam.title}</h3>
            <p>${exam.description || ''}</p>
            <span class="q-count">${exam.questionCount ?? '?'} QUESTIONS</span>
          `;
          grid.appendChild(a);
        });
        root.appendChild(grid);
      });
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>

<script>
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
}
</script>
</body>
</html>
